name: finance-aggregator

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    restart: unless-stopped
    build:
      context: .
    environment:
      FINANCE_ENVIRONMENT: development
      FINANCE_LOG_LEVEL: INFO
      FINANCE_DATABASE_URL: postgresql+psycopg://finance:finance@db:5432/finance
      FINANCE_IMPORT_STORAGE_ROOT: /var/lib/finance-aggregator/imports
      FINANCE_IMPORT_MAX_FILE_SIZE_BYTES: 26214400
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - import-storage:/var/lib/finance-aggregator/imports
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
    restart: unless-stopped
    entrypoint: ["python", "-m", "apps.worker.main"]
    environment:
      FINANCE_ENVIRONMENT: development
      FINANCE_LOG_LEVEL: INFO
      FINANCE_DATABASE_URL: postgresql+psycopg://finance:finance@db:5432/finance
      FINANCE_IMPORT_STORAGE_ROOT: /var/lib/finance-aggregator/imports
      FINANCE_IMPORT_MAX_FILE_SIZE_BYTES: 26214400
      FINANCE_WORKER_POLL_INTERVAL_SECONDS: 1
      FINANCE_FX_AUTO_SYNC_ENABLED: "${FINANCE_FX_AUTO_SYNC_ENABLED:-true}"
      FINANCE_FX_AUTO_SYNC_INTERVAL_SECONDS: "${FINANCE_FX_AUTO_SYNC_INTERVAL_SECONDS:-3600}"
    volumes:
      - import-storage:/var/lib/finance-aggregator/imports
    depends_on:
      api:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    environment:
      FINANCE_FRONTEND_PROXY_TARGET: http://api:8000
      HOST: 0.0.0.0
      PORT: 5173
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  import-storage:
